[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x402-router-mcp"
version = "0.2.0"
description = "MCP server: find the cheapest working x402 API for any task from 20k+ live-tested endpoints (Base, Solana, USDC). Free search; optional paid tools pay per call via x402."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["x402", "mcp", "mcp-server", "ai-agents", "usdc", "base", "solana", "discovery", "router", "pay-per-call"]
dependencies = ["mcp>=1.10,<2", "httpx>=0.27"]

[project.optional-dependencies]
pay = ["x402[httpx,evm]>=2.20", "eth-account>=0.13"]

[project.urls]
Homepage = "https://github.com/camerxnduff/x402-router-mcp"
Router = "https://router-production-ab89.up.railway.app"
Dashboard = "https://router-production-ab89.up.railway.app/dashboard"

[project.scripts]
x402-router-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
