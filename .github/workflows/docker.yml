name: docker
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t x402-router-mcp:test .
      - name: Smoke test (MCP stdio handshake + tools/list)
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          p = subprocess.Popen(["docker","run","-i","--rm","x402-router-mcp:test"],
                               stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True)
          msgs = [
            {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}},
            {"jsonrpc":"2.0","method":"notifications/initialized"},
            {"jsonrpc":"2.0","id":2,"method":"tools/list"},
          ]
          for m in msgs:
            p.stdin.write(json.dumps(m)+"\n"); p.stdin.flush()
          tools = None
          for line in p.stdout:
            try: d = json.loads(line)
            except Exception: continue
            if d.get("id") == 2:
              tools = [t["name"] for t in d["result"]["tools"]]; break
          p.kill()
          print("tools:", tools)
          want = {"search_x402_endpoints","route_x402_request","get_registry_stats","get_paid_route_requirements"}
          sys.exit(0 if tools and want <= set(tools) else 1)
          PY
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          IMG=ghcr.io/camerxnduff/x402-router-mcp
          docker tag x402-router-mcp:test $IMG:latest
          docker tag x402-router-mcp:test $IMG:0.1.0
          docker push $IMG:latest
          docker push $IMG:0.1.0
